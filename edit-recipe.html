<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>تعديل الوصفة – خميرة رفيعة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange:      #E8440A;
    --orange-dark: #B33300;
    --orange-light:#F0855A;
    --blue-dark:   #1B3A8C;
    --cream:       #FFF8F4;
    --text:        #2A1A10;
  }
  html, body {
    width: 100%; min-height: 100%;
    background: #1a0a00;
    font-family: 'Cairo', sans-serif;
  }
  .scene {
    width: 100vw; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; gap: 18px;
    background: radial-gradient(ellipse at center, #3a1500 0%, #1a0800 60%, #0d0400 100%);
    padding: 28px 16px 40px;
  }
  .book-title {
    color: rgba(255,255,255,0.6);
    font-size: clamp(13px,1.6vw,17px);
    letter-spacing: 3px; font-weight: 400;
  }
  .card {
    background: var(--cream);
    border-radius: 12px;
    width: min(95vw, 560px);
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(232,68,10,0.3);
  }
  .card-header {
    background: var(--orange);
    padding: 20px 28px;
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-header::after {
    content: ''; position: absolute;
    left: -20px; top: 50%; transform: translateY(-50%);
    width: 90px; height: 90px;
    background: rgba(255,255,255,0.08); border-radius: 50%;
  }
  .card-header h1 {
    color: white; font-weight: 900;
    font-size: clamp(18px,3vw,26px);
    text-shadow: 1px 2px 6px rgba(0,0,0,0.25);
    position: relative; z-index: 1;
  }
  .btn-logout {
    background: rgba(255,255,255,0.2); color: white;
    border: 1px solid rgba(255,255,255,0.35);
    padding: 6px 14px; border-radius: 20px;
    font-family: 'Cairo', sans-serif; font-size: 13px;
    cursor: pointer; position: relative; z-index: 1;
    transition: background 0.2s;
  }
  .btn-logout:hover { background: rgba(255,255,255,0.32); }

  .card-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 14px; font-weight: 700; color: var(--text); }
  .field input,
  .field textarea,
  .field select {
    border: 1.5px solid rgba(232,68,10,0.25);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px; color: var(--text);
    background: white; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    text-align: right;
    resize: vertical;
  }
  .field input:focus,
  .field textarea:focus,
  .field select:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(232,68,10,0.12);
  }
  .field textarea { min-height: 90px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .ing-list { display: flex; flex-direction: column; gap: 8px; }
  .ing-row { display: flex; gap: 8px; align-items: center; }
  .ing-row input { flex: 1; }
  .btn-remove {
    background: none; border: 1.5px solid rgba(232,68,10,0.3);
    color: var(--orange); border-radius: 6px;
    width: 32px; height: 38px;
    font-size: 18px; cursor: pointer; flex-shrink: 0;
    transition: background 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-remove:hover { background: rgba(232,68,10,0.08); }
  .btn-add-ing {
    background: none; border: 1.5px dashed rgba(232,68,10,0.4);
    color: var(--orange); border-radius: 8px;
    padding: 8px; font-family: 'Cairo', sans-serif;
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: background 0.2s;
  }
  .btn-add-ing:hover { background: rgba(232,68,10,0.06); }

  .divider { border: none; border-top: 1px solid rgba(232,68,10,0.15); }

  .photo-preview {
    width: 100%; max-height: 220px; object-fit: cover;
    border-radius: 8px;
  }
  .photo-clear {
    margin-top: 8px;
    background: none; border: 1.5px solid rgba(232,68,10,0.3);
    color: var(--orange); border-radius: 6px; padding: 4px 12px;
    font-family: 'Cairo', sans-serif; font-size: 12px; cursor: pointer;
  }
  .photo-clear:hover { background: rgba(232,68,10,0.08); }

  .btn-submit {
    background: var(--orange); color: white; border: none;
    padding: 13px 28px; border-radius: 30px;
    font-family: 'Cairo', sans-serif;
    font-size: clamp(14px,1.6vw,16px); font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 18px rgba(232,68,10,0.4);
    width: 100%; margin-top: 4px;
  }
  .btn-submit:hover  { background: var(--orange-dark); transform: scale(1.02); }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-delete {
    background: none; color: #c0392b;
    border: 1.5px solid #c0392b;
    padding: 11px 28px; border-radius: 30px;
    font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; width: 100%;
  }
  .btn-delete:hover { background: #fde8e8; }

  .msg {
    font-size: 13px; text-align: center;
    border-radius: 6px; padding: 9px 14px; display: none;
  }
  .msg.show  { display: block; }
  .msg.error   { color: #c0392b; background: #fde8e8; }
  .msg.success { color: #1a6e2e; background: #e6f7eb; }

  .loading {
    color: rgba(255,255,255,0.6); font-size: 15px;
    text-align: center; padding: 40px;
  }

  .back-link {
    color: rgba(255,255,255,0.45); font-size: 13px;
    text-decoration: none; letter-spacing: 1px;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--orange-light); }
</style>
</head>
<body>
<div class="scene">
  <p class="book-title">Catalogue de Recettes · خميرة رفيعة</p>

  <div class="card">
    <div class="card-header">
      <h1>تعديل الوصفة</h1>
      <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div class="card-body" id="cardBody">
      <div class="loading">جارٍ تحميل الوصفة…</div>
    </div>
  </div>

  <a class="back-link" href="index.html">← العودة إلى الكتالوج</a>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth();

  // ── Get recipe id from URL ?id=xxx ────────────────────────
  const params   = new URLSearchParams(window.location.search);
  const recipeId = params.get('id');

  if (!recipeId) {
    window.location.href = 'index.html';
  }

  let coverPhotoBase64 = null;
  let currentRecipe    = null;

  // ── Load recipe & render form ─────────────────────────────
  async function loadRecipe() {
    try {
      const recipe = await getRecipe(recipeId);
      if (!recipe || recipe.message) {
        document.getElementById('cardBody').innerHTML =
          '<div class="loading">لم يتم العثور على الوصفة.</div>';
        return;
      }

      // Check ownership
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      const ownerId = recipe.createdBy?._id || recipe.createdBy;
      if (user._id && ownerId && user._id !== ownerId) {
        document.getElementById('cardBody').innerHTML =
          '<div class="loading" style="color:#c0392b">ليس لديك صلاحية تعديل هذه الوصفة.</div>';
        return;
      }

      currentRecipe    = recipe;
      coverPhotoBase64 = recipe.coverPhoto || null;
      renderForm(recipe);
    } catch (err) {
      document.getElementById('cardBody').innerHTML =
        '<div class="loading">خطأ في تحميل الوصفة.</div>';
    }
  }

  function renderForm(r) {
    const hasPhoto = !!r.coverPhoto;
    document.getElementById('cardBody').innerHTML = `
      <div id="statusMsg" class="msg"></div>

      <!-- Name -->
      <div class="field">
        <label for="recipeName">اسم الوصفة *</label>
        <input type="text" id="recipeName" value="${escHtml(r.name)}" required/>
      </div>

      <!-- Category & temp -->
      <div class="row">
        <div class="field">
          <label for="category">الفئة</label>
          <select id="category">
            <option value="">اختر الفئة</option>
            ${['خبز','بريوش','معجنات','حلويات','أخرى'].map(c =>
              `<option value="${c}" ${r.category === c ? 'selected' : ''}>${c}</option>`
            ).join('')}
          </select>
        </div>
        <div class="field">
          <label for="temp">درجة الحرارة (°م)</label>
          <input type="number" id="temp" value="${r.temperature ?? ''}" min="0" max="300"/>
        </div>
      </div>

      <!-- Times -->
      <div class="row">
        <div class="field">
          <label for="fermentTime">وقت التخمير (دقيقة)</label>
          <input type="number" id="fermentTime" value="${r.fermentationTime ?? ''}" min="0"/>
        </div>
        <div class="field">
          <label for="bakeTime">وقت الخبز (دقيقة)</label>
          <input type="number" id="bakeTime" value="${r.bakeTime ?? ''}" min="0"/>
        </div>
      </div>

      <hr class="divider"/>

      <!-- Ingredients -->
      <div class="field">
        <label>المكونات *</label>
        <div class="ing-list" id="ingList">
          ${r.ingredients.map(ing => `
            <div class="ing-row">
              <input type="text" value="${escHtml(ing)}"/>
              <button class="btn-remove" onclick="removeIng(this)" title="حذف">×</button>
            </div>`).join('')}
        </div>
        <button class="btn-add-ing" onclick="addIng()">+ إضافة مكوّن</button>
      </div>

      <hr class="divider"/>

      <!-- Steps -->
      <div class="field">
        <label for="steps">خطوات التحضير *</label>
        <textarea id="steps">${escHtml(r.steps.join('\n'))}</textarea>
      </div>

      <!-- YouTube -->
      <div class="field">
        <label for="youtube">رابط يوتيوب شورتس (اختياري)</label>
        <input type="text" id="youtube"
          value="${r.youtubeId ? 'https://www.youtube.com/watch?v=' + r.youtubeId : ''}"
          oninput="previewYoutube(this.value)"/>
        <div id="ytPreviewWrap" style="${r.youtubeId ? '' : 'display:none;'}margin-top:8px;border-radius:10px;overflow:hidden;background:#000;position:relative;padding-bottom:177.78%;">
          <iframe id="ytPreviewFrame"
            src="${r.youtubeId ? 'https://www.youtube.com/embed/' + r.youtubeId + '?rel=0' : ''}"
            style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen></iframe>
        </div>
        <p id="ytError" style="display:none;font-size:12px;color:#c0392b;margin-top:4px;">رابط شورتس غير صحيح، مثال: https://youtube.com/shorts/xxxx</p>
      </div>

      <!-- Notes -->
      <div class="field">
        <label for="notes">الحشوة / ملاحظات (اختياري)</label>
        <textarea id="notes" style="min-height:60px;">${escHtml(r.notes || '')}</textarea>
      </div>

      <!-- Photo -->
      <div class="field">
        <label for="photoUrl">صورة الغلاف (اختياري)</label>
        <input type="text" id="photoUrl" value="${escHtml(r.coverPhoto || '')}" placeholder="الصق رابط الصورة من ibb.co أو أي رابط مباشر" oninput="previewPhotoUrl(this.value)"/>
        <p style="font-size:11px;color:#aaa;margin-top:4px;">💡 ارفع صورتك على <a href="https://imgbb.com" target="_blank" style="color:var(--orange)">imgbb.com</a> واحصل على الرابط المباشر</p>
        ${hasPhoto
          ? `<img id="photoPreview" class="photo-preview" src="${r.coverPhoto}" alt="معاينة" style="margin-top:8px;border-radius:8px;width:100%;max-height:160px;object-fit:contain;"/>`
          : `<img id="photoPreview" class="photo-preview" style="display:none;margin-top:8px;border-radius:8px;width:100%;max-height:160px;object-fit:contain;" alt="معاينة"/>`}
        <p id="photoErr" style="display:none;font-size:12px;color:#c0392b;margin-top:4px;">تعذّر تحميل الصورة — تأكد أن الرابط مباشر</p>
        <button class="photo-clear" id="photoClear"
          style="${hasPhoto ? '' : 'display:none'}"
          onclick="clearPhoto()">× حذف الصورة</button>
      </div>

      <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">حفظ التعديلات ✓</button>
      <button class="btn-delete" onclick="handleDelete()">🗑 حذف هذه الوصفة</button>
    `;
  }

  // ── Ingredients helpers ───────────────────────────────────
  function addIng() {
    const list = document.getElementById('ingList');
    const row  = document.createElement('div');
    row.className = 'ing-row';
    row.innerHTML = `
      <input type="text" placeholder="مثال: 500 مل ماء"/>
      <button class="btn-remove" onclick="removeIng(this)" title="حذف">×</button>`;
    list.appendChild(row);
    row.querySelector('input').focus();
  }

  function removeIng(btn) {
    const list = document.getElementById('ingList');
    if (list.children.length > 1) btn.parentElement.remove();
  }

  // ── Photo URL ────────────────────────────────────────────
  let coverPhotoUrl = null;

  function previewPhotoUrl(url) {
    const preview = document.getElementById('photoPreview');
    const err     = document.getElementById('photoErr');
    const clear   = document.getElementById('photoClear');
    if (!url.trim()) {
      preview.style.display = 'none';
      err.style.display     = 'none';
      clear.style.display   = 'none';
      return;
    }
    preview.onload  = () => {
      preview.style.display = 'block';
      err.style.display     = 'none';
      clear.style.display   = 'inline-block';
    };
    preview.onerror = () => {
      preview.style.display = 'none';
      err.style.display     = 'block';
      clear.style.display   = 'none';
    };
    preview.src = url.trim();
  }

  function clearPhoto() {
    document.getElementById('photoUrl').value             = '';
    document.getElementById('photoPreview').src           = '';
    document.getElementById('photoPreview').style.display = 'none';
    document.getElementById('photoClear').style.display   = 'none';
    document.getElementById('photoErr').style.display     = 'none';
  }

  // ── YouTube id extractor ──────────────────────────────────
  function extractYoutubeId(url) {
    if (!url) return null;
    // Support Shorts: youtube.com/shorts/ID
    const shortsMatch = url.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/);
    if (shortsMatch) return shortsMatch[1];
    // Fallback: normal watch?v= or youtu.be or embed
    const match = url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
    return match ? match[1] : null;
  }

  function previewYoutube(url) {
    const wrap  = document.getElementById('ytPreviewWrap');
    const frame = document.getElementById('ytPreviewFrame');
    const err   = document.getElementById('ytError');
    const id    = extractYoutubeId(url);
    if (!url) {
      wrap.style.display = 'none';
      err.style.display  = 'none';
      frame.src = '';
      return;
    }
    if (id) {
      frame.src          = 'https://www.youtube.com/embed/' + id + '?rel=0';
      wrap.style.display = 'block';
      err.style.display  = 'none';
    } else {
      wrap.style.display = 'none';
      err.style.display  = 'block';
      frame.src = '';
    }
  }

  // ── Save edits ────────────────────────────────────────────
  async function handleSubmit() {
    const name      = document.getElementById('recipeName').value.trim();
    const category  = document.getElementById('category').value;
    const temp      = document.getElementById('temp').value;
    const ferment   = document.getElementById('fermentTime').value;
    const bakeTime  = document.getElementById('bakeTime').value;
    const stepsRaw  = document.getElementById('steps').value.trim();
    const youtube   = document.getElementById('youtube').value.trim();
    const notes     = document.getElementById('notes').value.trim();
    const btn       = document.getElementById('submitBtn');

    const ingredients = Array.from(
      document.querySelectorAll('#ingList .ing-row input')
    ).map(i => i.value.trim()).filter(Boolean);

    if (!name)               return showMsg('error', 'يرجى إدخال اسم الوصفة');
    if (!ingredients.length) return showMsg('error', 'يرجى إضافة مكوّن واحد على الأقل');
    if (!stepsRaw)           return showMsg('error', 'يرجى كتابة خطوات التحضير');

    const steps      = stepsRaw.split('\n').map(s => s.trim()).filter(Boolean);
    const youtubeId  = extractYoutubeId(youtube);

    const payload = {
      name,
      category:         category || '',
      temperature:      temp     ? Number(temp)    : null,
      fermentationTime: ferment  ? Number(ferment) : null,
      bakeTime:         bakeTime ? Number(bakeTime): null,
      ingredients,
      steps,
      youtubeId:  youtubeId  || null,
      notes:      notes      || '',
      coverPhoto: document.getElementById('photoUrl')?.value.trim() || null,
    };

    btn.disabled    = true;
    btn.textContent = 'جارٍ الحفظ...';

    try {
      const data = await updateRecipe(recipeId, payload);
      if (data && data._id) {
        showMsg('success', '✓ تم حفظ التعديلات بنجاح!');
        setTimeout(() => window.location.href = 'index.html', 1200);
      } else {
        showMsg('error', data.message || 'فشل حفظ التعديلات.');
      }
    } catch {
      showMsg('error', 'خطأ في الاتصال بالخادم.');
    } finally {
      btn.disabled    = false;
      btn.textContent = 'حفظ التعديلات ✓';
    }
  }

  // ── Delete ────────────────────────────────────────────────
  async function handleDelete() {
    if (!confirm('هل أنت متأكد من حذف هذه الوصفة؟ لا يمكن التراجع.')) return;
    try {
      const data = await deleteRecipe(recipeId);
      if (data && (data.message || data._id)) {
        window.location.href = 'index.html';
      } else {
        showMsg('error', data.message || 'فشل الحذف.');
      }
    } catch {
      showMsg('error', 'خطأ في الاتصال بالخادم.');
    }
  }

  // ── Helpers ───────────────────────────────────────────────
  function showMsg(type, text) {
    const el = document.getElementById('statusMsg');
    el.className = `msg ${type} show`;
    el.textContent = text;
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function escHtml(str) {
    return String(str ?? '')
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
      .replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Boot ──────────────────────────────────────────────────
  loadRecipe();
</script>
</body>
</html>
